<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>UIL Heart Rate Demo – Minimal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Chart.js: external library, global Chart object -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Our JS modules (order matters!) -->
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/chart-view.js"></script>
  <script src="../assets/js/scoreboard-view.js"></script>
  <script src="../assets/js/heart-rate.js"></script>
</head>
<body>
  <!-- ENTRY VIEW (for facilitator) -->
  <div id="entryView" style="display:none;">
    <h1>Data Entry (Facilitator)</h1>
    <p>Use this screen to enter heart rates for each visitor.</p>

    <label>
      Visitor name / code:
      <input id="nameInput" type="text" placeholder="e.g. Anna, S3" />
    </label>
    <br /><br />

    <label>
      Resting HR:
      <input id="restInput" type="number" placeholder="e.g. 72" />
    </label>
    <br /><br />

    <label>
      Stress HR:
      <input id="stressInput" type="number" placeholder="e.g. 88" />
    </label>
    <br /><br />

    <label>
      Relax HR:
      <input id="relaxInput" type="number" placeholder="e.g. 76" />
    </label>
    <br /><br />

    <button id="saveVisitorBtn">Save visitor</button>

    <p id="entryStatus"></p>
  </div>

  <!-- GRAPH VIEW (small screen) -->
  <div id="graphView" style="display:none;">
    <h1>Heart Rate Graph</h1>
    <p id="graphStatus">Waiting for data…</p>
    <div style="width: 100%; max-width: 600px; height: 300px;">
      <canvas id="hrChart"></canvas>
    </div>
  </div>

  <!-- SCOREBOARD VIEW (large screen) -->
  <div id="scoreboardView" style="display:none;">
    <h1>Scoreboard Screen</h1>
    <p>All visitors (live updating).</p>
    <pre id="scoreboardData"></pre>
  </div>
</body>
</html>
